name: Content Validate (YMYL)

on:
  pull_request:
    paths:
      - 'content/**/*.mdx'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Validate content
        run: npm run content:validate
