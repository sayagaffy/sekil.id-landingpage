name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sekil.id
          NEXT_PUBLIC_APP_URL: https://app.sekil.id
          DATABASE_URL: postgresql://placeholder
          RESEND_API_KEY: placeholder
          RESEND_FROM: no-reply@sekil.id
          SALES_NOTIFICATION_EMAIL: ci@placeholder.com
          REPLY_TO_EMAIL: ci@placeholder.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
          TURNSTILE_SECRET_KEY: placeholder
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-PLACEHOLDER
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          # WHY: Keystatic CMS env vars required during Next.js build for
          # route generation. Using placeholder values; real secrets are only
          # needed for Keystatic GitHub mode in production, not CI builds.
          KEYSTATIC_GITHUB_CLIENT_ID: placeholder
          KEYSTATIC_GITHUB_CLIENT_SECRET: placeholder
          KEYSTATIC_SECRET: placeholder-secret-minimum-32-chars-fill
          NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: placeholder
